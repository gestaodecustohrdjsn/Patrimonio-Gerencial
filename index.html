<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sistema de controle patrimonial hospitalar">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Patrimônio+</title>
  <link rel="stylesheet" href="./css/styles.css?v=1.5.2">
</head>
<body>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="appRoot">
    <main class="login-page">
      <section class="login-card">
        <h1>Patrimônio+</h1>
        <p>Carregando sistema…</p>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="./js/runtime-v152/config.js?v=1.5.2"></script>
  <script>
    window.addEventListener("error", function (event) {
      const root = document.querySelector("#appRoot");
      if (!root) return;
      root.innerHTML = `<main class="login-page"><section class="login-card"><h1>Não foi possível iniciar</h1><p>O navegador não conseguiu carregar um arquivo do sistema.</p><p><strong>Detalhe:</strong> ${String(event.message || "erro desconhecido")}</p><p>Build esperado: 1.5.2</p></section></main>`;
    });
  </script>
  <script type="module" src="./js/runtime-v152/app.js?v=1.5.2"></script>
</body>
</html>
